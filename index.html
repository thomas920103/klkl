<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클클 매장관리</title>
<meta name="theme-color" content="#3B6CF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="클클">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --pri: #3B6CF6; --bg: #F4F6FA; --text: #1A2230; --sub: #5B6576; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--text); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 2; transition: opacity .3s; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 88px; height: 88px; border-radius: 22px; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #D6E0FD; border-top-color: var(--pri); animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #help { display: none; max-width: 300px; text-align: center; font-size: 14px; color: var(--sub); line-height: 1.6; padding: 0 16px; }
  #help a { display: inline-block; margin-top: 8px; padding: 10px 16px; border-radius: 12px; background: var(--pri); color: #fff; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="spin"></div>
  <div id="help">앱이 열리지 않으면 인터넷 연결을 확인하고 다시 열어주세요.<br>
    <a id="open" target="_blank" rel="noopener">브라우저로 열기</a></div>
</div>
<iframe id="app" title="클클 매장관리" allow="camera; geolocation; clipboard-write; fullscreen"></iframe>
<script>
  // 구글 앱스 스크립트 웹앱 주소 (Code.gs를 '새 배포'로 바꾸면 여기 주소도 바꿔야 함)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwDbWa78KSnoGpA1AcHn8_z1TSBulfM1cVnpFU5k1jrnUZ6v4roR_3Rh-EJAas1SB9jLA/exec';
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('open').href = APP_URL;
  frame.addEventListener('load', function () { splash.classList.add('hide'); });
  frame.src = APP_URL;
  // 20초가 지나도 안 열리면 도움말 표시
  setTimeout(function () { if (!splash.classList.contains('hide')) document.getElementById('help').style.display = 'block'; }, 20000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
